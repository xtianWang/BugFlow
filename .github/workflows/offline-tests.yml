name: offline-tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    env:
      BUGFLOW_SECRET_KEY: ci-only-public-test-value-never-for-production
      BUGFLOW_DATABASE_URL: sqlite://
      BUGFLOW_LLM_API_KEY: ''
      BUGFLOW_LLM_MODEL: ''
      BUGFLOW_LLM_BASE_URL: 'https://offline.invalid/v1'
      BUGFLOW_AGENT_REPOSITORIES: '{}'
      BUGFLOW_SANDBOX_IMAGE: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -v -p no:cacheprovider
      - run: git diff --exit-code
